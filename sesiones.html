<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesiones | Pausando el Tiempo</title>
    <meta name="description"
        content="Galería de sesiones fotográficas de Pau Rosselló. Retratos con alma y personalidad en un entorno minimalista.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 'zen-dark': '#2D2D2D', 'zen-light': '#FFFFFF', 'zen-grey': '#E5E7EB' },
                    fontFamily: { sans: ['Montserrat', 'sans-serif'], serif: ['Merriweather', 'serif'] }
                }
            }
        }
    </script>
</head>

<body class="bg-white text-zen-dark antialiased">

    <!-- Header -->
    <header id="main-header"
        class="fixed top-0 left-0 w-full z-50 transition-all duration-300 px-6 py-4 md:px-12 md:py-6 bg-white">
        <div class="max-w-7xl mx-auto flex justify-between items-center border-b border-zen-grey pb-4">
            <a href="index.html" class="flex items-center">
                <img src="images/logo_black.png" alt="Pausando el Tiempo" class="h-8 md:h-10">
            </a>
            <nav
                class="hidden md:flex items-center space-x-8 text-[10px] uppercase tracking-[0.2em] font-sans font-bold">
                <a href="index.html" class="hover:text-gray-400 transition-colors">Inicio</a>
                <a href="fotografia.html" class="active-nav-link">Fotografía</a>
                <a href="videografia.html" class="hover:text-gray-400 transition-colors">Videografía</a>
                <a href="sobre-mi.html" class="hover:text-gray-400 transition-colors">Sobre mí</a>
                <a href="contacto.html" class="hover:text-gray-400 transition-colors">Contacto</a>
            </nav>
            <button id="menu-toggle" class="md:hidden p-2"><svg class="w-6 h-6" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7">
                    </path>
                </svg></button>
        </div>
    </header>

    <!-- Mobile Nav -->
    <div id="mobile-nav"
        class="fixed inset-0 bg-white z-[60] flex flex-col items-center justify-center space-y-8 text-lg uppercase tracking-widest font-sans transition-transform duration-500 translate-x-full">
        <button id="menu-close" class="absolute top-6 right-6 p-2"><svg class="w-8 h-8" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg></button>
        <a href="index.html">Inicio</a>
        <a href="fotografia.html" class="active-nav-link">Fotografía</a>
        <a href="videografia.html">Videografía</a>
        <a href="sobre-mi.html">Sobre mí</a>
        <a href="contacto.html">Contacto</a>
    </div>

    <main class="pt-32 pb-20">
        <div class="max-w-7xl mx-auto px-6">
            <div class="text-center mb-16">
                <h1 class="text-sm md:text-base tracking-[0.4em] font-sans font-bold text-gray-400 uppercase mb-2">
                    SESIONES</h1>
                <p class="mt-4 text-gray-600 font-serif italic">Retratos con alma y personalidad</p>
                <div class="w-20 h-[1px] bg-zen-dark mx-auto mt-6"></div>
            </div>

            <!-- Masonry Grid -->
            <div class="columns-1 md:columns-2 lg:columns-3 gap-8 space-y-8 fade-in">
                <!-- Fotos 01-07 -->
                <div class="gallery-item cursor-pointer overflow-hidden group"><img
                        src="images/sesiones/sesiones_01.jpg" alt="Sesión Fotográfica 01"
                        class="w-full hover:scale-105 transition-all duration-700"></div>
                <div class="gallery-item cursor-pointer overflow-hidden group"><img
                        src="images/sesiones/sesiones_02.jpg" alt="Sesión Fotográfica 02"
                        class="w-full hover:scale-105 transition-all duration-700"></div>
                <div class="gallery-item cursor-pointer overflow-hidden group"><img
                        src="images/sesiones/sesiones_03.jpg" alt="Sesión Fotográfica 03"
                        class="w-full hover:scale-105 transition-all duration-700"></div>
                <div class="gallery-item cursor-pointer overflow-hidden group"><img
                        src="images/sesiones/sesiones_04.jpg" alt="Sesión Fotográfica 04" loading="lazy"
                        class="w-full hover:scale-105 transition-all duration-700"></div>
                <div class="gallery-item cursor-pointer overflow-hidden group"><img
                        src="images/sesiones/sesiones_05.jpg" alt="Sesión Fotográfica 05" loading="lazy"
                        class="w-full hover:scale-105 transition-all duration-700"></div>
                <div class="gallery-item cursor-pointer overflow-hidden group"><img
                        src="images/sesiones/sesiones_06.jpg" alt="Sesión Fotográfica 06" loading="lazy"
                        class="w-full hover:scale-105 transition-all duration-700"></div>
                <div class="gallery-item cursor-pointer overflow-hidden group"><img
                        src="images/sesiones/sesiones_07.jpg" alt="Sesión Fotográfica 07" loading="lazy"
                        class="w-full hover:scale-105 transition-all duration-700"></div>
            </div>
        </div>
    </main>

    <footer class="py-16 border-t border-zen-grey bg-zen-dark text-white">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <img src="images/logo_white.png" alt="Pausando el Tiempo" class="h-10 mx-auto mb-8">
            <div class="flex justify-center space-x-6 mb-10 items-center">
                <a href="https://www.instagram.com/pau.sandoeltiempo?igsh=MTF3dnNncjJtaTZtdw==" target="_blank"
                    rel="noopener noreferrer" class="hover:opacity-70 transition-opacity">
                    <img src="images/RRSS/Instagram_icon.svg" alt="Instagram" class="h-6 w-auto">
                </a>
                <a href="https://www.linkedin.com/in/pau-rosselló-cardona-9163212a6?utm_source=share_via&utm_content=profile&utm_medium=member_android" target="_blank"
                    rel="noopener noreferrer" class="hover:opacity-70 transition-opacity">
                    <img src="images/RRSS/LinkedIn_icon.svg" alt="LinkedIn" class="h-6 w-auto">
                </a>
                <a href="https://api.whatsapp.com/send?phone=34677810523" target="_blank" rel="noopener noreferrer"
                    class="hover:opacity-70 transition-opacity">
                    <img src="images/RRSS/WhatsApp_icon.svg" alt="WhatsApp" class="h-6 w-auto">
                </a>
            </div>
            <p class="text-[9px] uppercase tracking-[0.3em] text-gray-400 font-bold mb-2">
                Madrid, España
            </p>
            <p class="text-[9px] uppercase tracking-[0.3em] text-gray-400 font-bold">
                pausandoeltiempo.fotos@gmail.com
            </p>
        </div>
    </footer>

    <!-- Lightbox -->
    <div id="lightbox" class="fixed inset-0 bg-black/95 z-[100] hidden items-center justify-center p-4">
        <img src="" alt="Full view" class="max-w-full max-h-full object-contain">
        <button class="absolute top-6 right-6 text-white text-4xl">&times;</button>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
