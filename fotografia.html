<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotografía | Pausando el Tiempo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 'zen-dark': '#2D2D2D', 'zen-light': '#FFFFFF', 'zen-grey': '#E5E7EB' },
                    fontFamily: { sans: ['Montserrat', 'sans-serif'], serif: ['Merriweather', 'serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-white text-zen-dark antialiased">

    <!-- Header -->
    <header id="main-header" class="fixed top-0 left-0 w-full z-50 transition-all duration-300 px-6 py-4 md:px-12 md:py-6 bg-white">
        <div class="max-w-7xl mx-auto flex justify-between items-center border-b border-zen-grey pb-4">
            <a href="index.html" class="flex items-center">
                <img src="images/logo_black.png" alt="Pausando el Tiempo" class="h-8 md:h-10">
            </a>
            <nav class="hidden md:flex items-center space-x-8 text-[10px] uppercase tracking-[0.2em] font-sans font-bold">
                <a href="index.html" class="hover:text-gray-400 transition-colors">Inicio</a>
                <a href="fotografia.html" class="text-gray-900 border-b border-black">Fotografía</a>
                <a href="videografia.html" class="hover:text-gray-400 transition-colors">Videografía</a>
                <a href="sobre-mi.html" class="hover:text-gray-400 transition-colors">Sobre mí</a>
                <a href="contacto.html" class="hover:text-gray-400 transition-colors">Contacto</a>
            </nav>
            <button id="menu-toggle" class="md:hidden p-2"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg></button>
        </div>
    </header>

    <!-- Mobile Nav -->
    <div id="mobile-nav" class="fixed inset-0 bg-white z-[60] flex flex-col items-center justify-center space-y-8 text-lg uppercase tracking-widest font-sans transition-transform duration-500 translate-x-full">
        <button id="menu-close" class="absolute top-6 right-6 p-2"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
        <a href="index.html">Inicio</a>
        <a href="fotografia.html">Fotografía</a>
        <a href="videografia.html">Videografía</a>
        <a href="sobre-mi.html">Sobre mí</a>
        <a href="contacto.html">Contacto</a>
    </div>

    <main class="pt-32 pb-20">
        <div class="max-w-7xl mx-auto px-6">
            <!-- Title Section -->
            <div class="text-center mb-16 fade-in">
                <h2 class="text-sm md:text-base tracking-[0.4em] font-sans font-bold text-gray-400 uppercase mb-2">GALERÍAS DE FOTOGRAFÍA</h2>
                <div class="w-20 h-[1px] bg-zen-dark mx-auto mt-4"></div>
            </div>

            <!-- Category Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-6xl mx-auto">
                <!-- Gastronomía -->
                <a href="gastronomia.html" class="group relative overflow-hidden aspect-[3/4] bg-gray-100 fade-in">
                    <img src="images/cover_gastronomia.jpg" alt="Gastronomía" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                    <div class="absolute inset-0 bg-black/40 group-hover:bg-black/10 transition-colors flex items-end p-8">
                        <div class="text-white">
                            <h3 class="text-xl md:text-2xl font-sans font-bold uppercase tracking-[0.2em] mb-2">Gastronomía</h3>
                            <p class="text-[10px] uppercase tracking-widest opacity-0 group-hover:opacity-100 transition-opacity">Ver galería</p>
                        </div>
                    </div>
                </a>

                <!-- Social (Eventos) -->
                <a href="eventos.html" class="group relative overflow-hidden aspect-[3/4] bg-gray-100 fade-in" style="transition-delay: 0.1s">
                    <img src="images/cover_eventos.jpg" alt="Eventos" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                    <div class="absolute inset-0 bg-black/40 group-hover:bg-black/10 transition-colors flex items-end p-8">
                        <div class="text-white">
                            <h3 class="text-xl md:text-2xl font-sans font-bold uppercase tracking-[0.2em] mb-2">Eventos</h3>
                            <p class="text-[10px] uppercase tracking-widest opacity-0 group-hover:opacity-100 transition-opacity">Ver galería</p>
                        </div>
                    </div>
                </a>

                <!-- Sesiones -->
                <a href="sesiones.html" class="group relative overflow-hidden aspect-[3/4] bg-gray-100 fade-in" style="transition-delay: 0.2s">
                    <img src="images/cover_sesiones.jpg" alt="Sesiones" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                    <div class="absolute inset-0 bg-black/40 group-hover:bg-black/10 transition-colors flex items-end p-8">
                        <div class="text-white">
                            <h3 class="text-xl md:text-2xl font-sans font-bold uppercase tracking-[0.2em] mb-2">Sesiones</h3>
                            <p class="text-[10px] uppercase tracking-widest opacity-0 group-hover:opacity-100 transition-opacity">Ver galería</p>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </main>

    <footer class="py-16 border-t border-zen-grey bg-zen-dark text-white">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <img src="images/logo_white.png" alt="Pausando el Tiempo" class="h-10 mx-auto mb-8">
            <div class="flex justify-center space-x-6 mb-10 items-center">
                <a href="https://www.instagram.com/pau.sandoeltiempo?igsh=MTF3dnNncjJtaTZtdw==" target="_blank" rel="noopener noreferrer" class="hover:opacity-70 transition-opacity">
                    <img src="images/RRSS/Instagram_icon.png" alt="Instagram" class="h-6 w-auto">
                </a>
                <a href="https://api.whatsapp.com/send?phone=34677810523" target="_blank" rel="noopener noreferrer" class="hover:opacity-70 transition-opacity">
                    <img src="images/RRSS/WhatsApp_icon.png" alt="WhatsApp" class="h-6 w-auto">
                </a>
            </div>
            <p class="text-[9px] uppercase tracking-[0.3em] text-gray-300 font-bold">
                pausandoeltiempo.fotos@gmail.com
            </p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
